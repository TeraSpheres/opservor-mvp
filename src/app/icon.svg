<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32" role="img" aria-label="Opservor">
  <title>Opservor</title>
  <!-- Browser tab icon. Opservor's own mark, not the TeraSpheres one — the app
       is the product, and putting the parent company's mark on it is exactly
       the mistake TS-BRAND-001 section 2.2 exists to prevent.

       Heavier than the sidebar version on purpose: at 16px the faint far-side
       bands and a thin sphere outline disappear entirely, so only the
       silhouette is kept. -->
  <rect width="64" height="64" fill="#0A0F1A"/>
  <g stroke="#3B82F6" stroke-width="5" fill="none" opacity="0.42">
    <ellipse cx="32" cy="32" rx="25" ry="8.5" transform="rotate(-18 32 32)"/>
    <ellipse cx="32" cy="32" rx="25" ry="8.5" transform="rotate(40 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="13" fill="#22D3EE" opacity="0.16"/>
  <circle cx="32" cy="32" r="13" stroke="#22D3EE" stroke-width="3" fill="none"/>
  <g stroke="#22D3EE" stroke-width="5.6" fill="none" stroke-linecap="round">
    <path d="M51.15 47.07 A25 8.5 40 0 1 12.85 16.93"/>
    <path d="M55.78 24.27 A25 8.5 -18 0 1 8.22 39.73"/>
  </g>
</svg>
